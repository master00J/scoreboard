name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build macOS (dmg + zip)
        run: npm run electron:build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify artifacts
        run: |
          set -euo pipefail
          ls -la dist/
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          zips=(dist/*.zip)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "Geen .dmg in dist/ — electron-builder --mac is mislukt."
            exit 1
          fi
          echo "DMG: ${dmgs[*]}"
          echo "ZIP: ${zips[*]:-(geen)}"

      - name: Checksums
        run: npm run release:checksums

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stadium-scoreboard-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Preview Windows

# Bouwt een ongesigneerde test-.exe, zodat je iets kunt proberen vóór klanten het krijgen:
# bij elke pull request, en bij elke push naar staging. Deze workflow krijgt geen secrets:
# signeren gebeurt alleen in Release Windows, en die draait alleen op master.

on:
  pull_request:
    branches: [master, staging]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: preview-win-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Eigen versienummer voor een staging-build, zodat niemand hem verwart met de versie
      # die klanten draaien. Release Windows bepaalt het echte nummer, op master.
      - name: Stamp staging version
        if: github.event_name == 'push'
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version")
          npm version "${base}-staging.${{ github.run_number }}" --no-git-tag-version
          node -p "'staging-versie: ' + require('./package.json').version"

      - name: Build Windows (unsigned)
        run: npm run electron:build:win

      - name: Upload test .exe
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ github.event_name == 'pull_request'
                && format('Stadium-Scoreboard-preview-pr{0}', github.event.pull_request.number)
                || format('Stadium-Scoreboard-staging-{0}', github.run_number) }}
          path: dist/Stadium-Scoreboard.exe
          if-no-files-found: error
          retention-days: 7
